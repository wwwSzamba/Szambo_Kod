<!DOCTYPE html>
<html lang="pl">
<head><!--metadata strony-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!--ustawia szerokość strony na szerokość urządzenia-->
    <title>iwanan.gg - Statystyki Bohaterów</title>

    <link rel="stylesheet" href="style.css"><!--podpina style.css-->
    <link rel="stylesheet" href="bohaterowie.css"><!--podpina bohaterowie.css-->
    
    <script src="champions.js"></script><!--podpina champions.js-->
</head>

<body>
    <header class="navbar"><!--nagłówek strony-->
        <div class="container">
            <div class="logo">iwanan<span>.GG</span></div>
            <nav>
                <ul><!--menu nawigacji-->
                    <li><a href="index.html">Strona Główna</a></li>
                    <li><a href="bohaterowie.html" class="active">Bohaterowie</a></li>
                    <li><a href="rankingi.html">Rankingi</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="search-section" style="margin-top: 40px; margin-bottom: 30px;">
            <h2 class="section-title" style="margin-bottom: 20px;">Sprawdź Statystyki Bohaterów</h2>

            <div class="search-bar">
                <select class="region-select" id="region">
                    <option value="eune">EUNE</option>
                    <option value="euw">EUW</option>
                    <option value="na">NA</option>
                </select>

                <input type="text" class="search-input" id="riotId" placeholder="Nazwa gracza #TAG"><!--pole wyszukania-->
                <button class="search-button" onclick="searchPlayer()">Szukaj</button><!--przycisk szukaj-->
            </div>
        </div>

        <div id="results" style="display: none;"><!--siatka do wyników-->
            <div class="champion-grid-container">
                <div class="champion-grid" id="championGrid"></div>
            </div>
        </div>
    </div>

<script>
// Klucz API 
const API_KEY = "RGAPI-ddf66fc1-27d1-48e3-ba9c-0d37ca9f595b";


//funkcja przesyłająca url zapytania do proxy
async function fetchProxy(url) {
    const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
    const response = await fetch(proxyUrl);//czeka na odpowiedź od api
    
    //sprawdza status HTTP połączenia z proxy
    if (!response.ok) {
        throw new Error(`Błąd połączenia: ${response.status}`);
    }
    
    const data = await response.json();//zamienia json na obiekt
    
    //obsługa błędów, jeśli proxy działa, ale samo api riot zwróciło błąd
    if (data.status && data.status.status_code) {
        throw new Error(`Błąd Riot API (${data.status.status_code}): ${data.status.message}`);
    }
    
    return data;
}


//funkcja wyszukująca gracza
async function searchPlayer() {
    //pobieramy i formatujemy input użytkowinka
    const riotIdInput = document.getElementById('riotId').value.trim();
    const regionVal = document.getElementById('region').value;

    //wybór regionu
    let accountRouting = 'europe';
    if (regionVal === 'na') accountRouting = 'americas';

    //pobranie miejsca na wyniki
    const resultsDiv = document.getElementById('results');
    const grid = document.getElementById('championGrid');

    //sprawdzenie czy nazwa gracza ma poprawny format
    if (!riotIdInput.includes('#')) {
        alert('Wpisz Riot ID w formacie: Nazwa#TAG');
        return;
    }

    //rozdzielenia nazwy gracza
    const [gameName, tagLine] = riotIdInput.split('#');

    resultsDiv.style.display = 'block';//wyświetla miejsce na wyniki
    grid.innerHTML = 'Ładowanie... (łączenie przez proxy)';//wyświetla wiadomość o ładowaniu

    try {
        //pobieramy PUUID
        const accountUrl = `https://${accountRouting}.api.riotgames.com/riot/account/v1/accounts/by-riot-id/${encodeURIComponent(gameName)}/${encodeURIComponent(tagLine)}?api_key=${API_KEY}`;
        const accountData = await fetchProxy(accountUrl);
        
        if (!accountData.puuid) throw new Error('Nie znaleziono gracza o podanym Riot ID.');
        const puuid = accountData.puuid;//przydielamy puuid z accountData do odzielnego obiektu

        //pobieramy 10 id ostatnich meczów gracza
        const matchIdsUrl = `https://${accountRouting}.api.riotgames.com/lol/match/v5/matches/by-puuid/${puuid}/ids?start=0&count=10&api_key=${API_KEY}`;
        const matchIds = await fetchProxy(matchIdsUrl);

        if (!Array.isArray(matchIds)) throw new Error('Błąd podczas pobierania historii meczów.');//sprawdza czy matchIds jest tablicą
        if (matchIds.length === 0) throw new Error('Ten gracz nie zagrał żadnych meczów w wybranym trybie.');//sprawdza czy był chociarz jeden rozegrany mecz

        grid.innerHTML = 'Analizowanie ostatnich 10 meczów...';//wyświetla wiadomość o analizie

        //jednocześnie wysyłamy zapytanie o dane o każdy meczu
        const matchPromises = matchIds.map(id => {
            const matchUrl = `https://${accountRouting}.api.riotgames.com/lol/match/v5/matches/${id}?api_key=${API_KEY}`;
            return fetchProxy(matchUrl);
        });

        //czekamy aż wszystkie zapytania dostaną odpowiedź
        const matchesData = await Promise.all(matchPromises);

        //obliczany statystyki bohaterów
        const championStats = calculateChampionStats(matchesData, puuid);

        //wyświetlamy statystyki bohaterów
        renderChampions(championStats, matchIds.length);

    } catch (err) {
        //wyłapujemy i bezpieczne wyświetlenmy błąd w interfejsie
        grid.innerHTML = `<p style="color:#e74c3c;">Wystąpił błąd: ${err.message}</p>`;
        console.error("Szczegóły błędu:", err);
    }
}

//funkcja obliczająca statystyki bohaterów
function calculateChampionStats(matches, puuid) {
    const stats = {};//inicjalizacja statystyk

    matches.forEach(match => {
        //zabezpieczenie przed uszkodzonymi danymi meczu
        if(!match || !match.info || !match.info.participants) return;

        //metoda .find() szuka w tablicy uczestników naszego gracza
        const p = match.info.participants.find(x => x.puuid === puuid);
        if (!p) return;

        //jeśli bohatera nie ma jeszcze w obiekcie stats, tworzymy jego wpis
        if (!stats[p.championName]) {
            stats[p.championName] = { name: p.championName, played: 0, wins: 0 };
        }

        //aktualizacja statystyk dla danej gry
        stats[p.championName].played++;
        if (p.win) stats[p.championName].wins++;
    });

    //zmiana słownika na tablicę i sortowanie malejąco od najczęściej wybieranych bohaterów
    return Object.values(stats).sort((a, b) => b.played - a.played);
}

//funkcja wyświetlająca bohaterów
function renderChampions(championsData, totalMatchesAnalyzed) {
    const grid = document.getElementById('championGrid');//pobieramy miejsce na wyniki
    grid.innerHTML = ''; //czyszczenie gridu przed renderowaniem nowych wyników

    //sprawdzenie czy mamy statystyki boheterów dla gracza
    if (championsData.length === 0) {
        grid.innerHTML = 'Brak statystyk bohaterów dla tego gracza w ostatnich meczach.';
        return;
    }

    championsData.forEach(champ => {
        const winRate = ((champ.wins / champ.played) * 100).toFixed(1);//obliczenie winrate dla bohatera
        const pickRate = ((champ.played / totalMatchesAnalyzed) * 100).toFixed(1);//obliczenie pickrate dla bohatera

        //sprawdza czy winrate jest większy lub równy 50% i wyświetla go na zielono jeśli jest i na czerwono jeśli nie jest
        const winRateColor = winRate >= 50 ? '#2ecc71' : '#e74c3c';

        // próba pobrania obrazka z lokalnego pliku champions.js, w razie braku pobiera z data dragon riot
        const imageUrl = typeof championImages !== 'undefined' && championImages[champ.name] //sprawdza czy mamy obrazek bohatera
            ? championImages[champ.name] //daje nasz obrazek
            : `https://ddragon.leagueoflegends.com/cdn/14.8.1/img/champion/${champ.name}.png`;//ściąga obrazek z data dragon riotu

        //stworzenie karty bohatera i dodanie klasy
        const card = document.createElement('div');
        card.className = 'champion-image-container';

        //dodanie html do karty
        card.innerHTML = `
            <div class="image-wrapper">
                <img src="${imageUrl}" 
                     alt="${champ.name}"
                     onerror="this.src='https://ddragon.leagueoflegends.com/cdn/14.8.1/img/profileicon/29.png'">

                <div class="overlay">
                    <div><strong style="color:${winRateColor}">${winRate}%</strong> WR</div>
                    <div>Pick Rate: ${pickRate}%</div>
                    <div>Zagrane: ${champ.played}</div>
                </div>
            </div>

            <div class="champion-name">${champ.name}</div>
        `;

        //dołączanie stworzonego elementu do siatki wyników
        grid.appendChild(card);
    });
}
</script>

</body>
</html>
