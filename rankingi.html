<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iwanan.gg - Rankingi</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Kontener listy graczy z wewnętrznym przewijaniem */
        .challenger-scroll-box {
            max-height: 500px; 
            overflow-y: auto;
            padding-right: 10px;
            margin-bottom: 15px;
        }
        .challenger-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
        }
        .challenger-item:last-child { border-bottom: none; }
        .challenger-rank { color: var(--text-muted); width: 40px; }
        .challenger-name { color: white; font-weight: bold; flex-grow: 1; }
        .challenger-lp { color: #f1c40f; font-weight: bold; }
        
        /* Przycisk paginacji (załaduj więcej) */
        .load-more-btn {
            width: 100%;
            padding: 10px;
            background: rgba(52, 152, 219, 0.2);
            color: #3498db;
            border: 1px solid #3498db;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            display: none; 
        }
        .load-more-btn:hover { background: #3498db; color: white; }
        
        /* Niestandardowy pasek przewijania */
        .challenger-scroll-box::-webkit-scrollbar { width: 6px; }
        .challenger-scroll-box::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        .challenger-scroll-box::-webkit-scrollbar-thumb { background: #3498db; border-radius: 4px; }

        /* Układ elastyczny dla nawigacji regionów na ekranach smartfonów */
        .region-tabs {
            display: flex;
            flex-wrap: wrap;  /* przyciski nie wychodzą poza ekran na małym telefonie */
            gap: 8px;
            justify-content: center;
        }
        .region-btn {
            flex: 1 1 auto; /* rozciągają sie na tel */
            padding: 8px 12px;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        /*  Top Challengers  */
        .ranking-grid {
            display: flex;
            flex-direction: column;
            margin: 20px auto 50px auto; 
            max-width: 900px; 
            width: 100%; 
        }

        /* Adaptacja fontów dla szerszych ekranów */
        @media (min-width: 992px) {
            .ranking-grid {
                margin-top: 30px;
            }
            .region-btn {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="container">
            <div class="logo">iwanan<span>.GG</span></div>
            <nav>
                <ul>
                    <li><a href="index.html">Strona Główna</a></li>
                    <li><a href="bohaterowie.html">Bohaterowie</a></li>
                    <li><a href="rankingi.html" class="active">Rankingi</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container">
        <section class="region-selector" style="margin-top: 30px;">
            <div class="player-card" style="width: 100%; max-width: none; padding: 15px;">
                <p style="color: var(--text-muted); font-size: 0.8rem; margin-bottom: 10px; text-transform: uppercase; text-align: center;">Wybierz region:</p>
                <div class="region-tabs">
                    <button class="region-btn active" data-region="na1">North America</button>
                    <button class="region-btn" data-region="euw1">Europe West</button>
                    <button class="region-btn" data-region="eun1">Europe Nordic & East</button>
                    <button class="region-btn" data-region="kr">Korea</button>
                    <button class="region-btn" data-region="jp1">Japan</button>
                    <button class="region-btn" data-region="br1">Brazil</button>
                    <button class="region-btn" data-region="vn2">Vietnam</button>
                </div>
            </div>
        </section>

        <header class="section-title" style="margin-top: 30px; text-align: center;">
            <h2 style="font-size: 2.5rem; font-weight: 800; color: white;">Globalny Rozkład Rang</h2>
        </header>

        <main class="ranking-grid">
            <div class="player-card" style="padding: 20px; width: 100%; max-width: none;">
                <h3 style="color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; margin-bottom: 10px;">Top Challengers (Live)</h3>
                <p id="loading-text" style="color: #3498db; font-size: 0.8rem; margin-bottom: 10px;">Ładowanie danych z serwera...</p>
                
                <div class="challenger-scroll-box" id="challenger-list"></div>
                <button id="load-more-btn" class="load-more-btn">Załaduj więcej graczy</button>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Klucz wygasa co 24 godziny, jest przypisany do konta deweloperskiego riotu i posiada limit zapytan 20/1s i 100/2min
            const API_KEY = "RGAPI-ddf66fc1-27d1-48e3-ba9c-0d37ca9f595b"; 

            // In-memory cache zapobiegający redundancji zapytań sieciowych, przez to że riot narzuca limit zapytań, a dane o topce serwera zmieniają się co 24h więc nie ma po co odczytywac za każdym razem z sieci
            const cache = {}; 
            
            let allPlayers = [];      
            let displayedCount = 0;   
            const LOAD_CHUNK = 100; // Renderujemy tylko 100 graczy na raz, aby uniknąć zamrożenia interfejsu podczas parsowania dużych tablic (Lazy Loading), Riot api daje max 300 graczy w topce na region, więc 3 razy załaduj więcej i jest cała lista
            
            const listContainer = document.getElementById('challenger-list');
            const loadingText = document.getElementById('loading-text');
            const loadMoreBtn = document.getElementById('load-more-btn');

            // Asynchroniczne odpytywanie API z obsługą pamięci podręcznej i wyjątków sieciowych
            function fetchChallengers(region) {
                // Skrypt w pierwszej kolejności przeszukuje referencje obiektu cache, czy obiekt cache posiada klucz odpowiadający regionowi ma już dla danego regionu zapisaną listę graczy,
                // jak tak to return i nie marnujemy transferu na dane które już mamy w pamięci podręcznej
                if (cache[region]) {
                    listContainer.innerHTML = '';
                    allPlayers = cache[region];
                    displayedCount = 0;
                    loadMoreBtn.style.display = 'none';
                    loadingText.innerText = `Dane wczytane z pamięci podręcznej (${region.toUpperCase()})`;
                    loadingText.style.color = '#f1c40f'; 
                    
                    renderNextChunk();
                    return;  // dajemy aby nie wykonywał dalszej części funkcji, która odpytywałaby sieć, skoro mamy już dane w cache
                }

                // Generowanie poprawnego adresu Endpointu i enkapsulacja go do proxy CORS 
                // Serwer proxy corsproxy.io ma limit zapytań 50 na dzień,  alternatywy jak corsproxy ma awarię:  `https://api.allorigins.win/raw?url=${encodeURIComponent(riotUrl)}` lub `https://thingproxy.freeboard.io/fetch/${encodeURIComponent(riotUrl)}`
                const riotUrl = `https://${region}.api.riotgames.com/lol/league/v4/challengerleagues/by-queue/RANKED_SOLO_5x5?api_key=${API_KEY}`; // << nie ma w pamieci cache
                const apiUrl = `https://corsproxy.io/?${encodeURIComponent(riotUrl)}`;  
                 
                // Jak dane są w cache, to czyścimy aktualną listę w HTMLu i daje zapisanych graczy do allPlayers, resetujemy licznik wyświetlanych graczy i ukrywamy przycisk "Załaduj więcej"
                listContainer.innerHTML = '';
                allPlayers = []; 
                displayedCount = 0;
                loadMoreBtn.style.display = 'none';
                loadingText.innerText = `Łączenie przez bezpieczne proxy (${region.toUpperCase()})...`;
                loadingText.style.color = '#3498db';

                fetch(apiUrl)
                .then(response => {
                    if (!response.ok) throw new Error('Błąd głównego serwera proxy lub serwer docelowy odrzuca zapytanie');
                    return response.json();
                })
                .then(data => {
                    // Przypadki typu klucz API wygasł albo za dużo zyptań, wtedy łapiemy status od riot API i rzucamy błąd 
                    if (data.status && data.status.status_code) {
                        throw new Error(`Błąd Riot API ${data.status.status_code}: ${data.status.message}`);
                    }

                    if (!data.entries) throw new Error('Otrzymany plik JSON nie zawiera tablicy graczy (entries)');
                    
                    // Sortowanie wyników malejąco po lp (League points) i zapisujemy do cachea i przypisujemy do allPlayers
                    cache[region] = data.entries.sort((a, b) => b.leaguePoints - a.leaguePoints);
                    allPlayers = cache[region];

                    loadingText.innerText = `Sukces! Znaleziono w drabince: ${allPlayers.length} graczy!`;
                    loadingText.style.color = '#2ecc71';
                    
                    renderNextChunk(); 
                })
                // Łapiemy każdy bład który mogł wystąpić podczas zapytania asynchronicznego 
                .catch(error => {
                    loadingText.innerText = error.message;
                    loadingText.style.color = '#e74c3c';
                    console.error("Szczegóły błędu asynchronicznego:", error);
                });
            }

            // Metoda do sukcesywnego zapełniania kontenera DOM. Minimalizuje zjawisko "zamrożenia" wątku 
            // operacyjnego w przeglądarce podczas parsowania dużych tablic (Lazy Rendering)
            function renderNextChunk() {
                const endIndex = Math.min(displayedCount + LOAD_CHUNK, allPlayers.length); // w wiekszosci przypadkow wcztuje sie 300 graczy, ale w regionach mniejszych gdzie jest mniejszy playerbase
                                                                                            // sa przypadki ze np. tylko 250 graczy wczyta do allplayers.length, wtedy do ochrony przed wyjsciem poza 
                                                                                            // zakres tablicy, przyjmuje mniejsza wartosc z dwoch, czyli albo 100*n albo allPlayers.length
                
                for (let i = displayedCount; i < endIndex; i++) {
                    const player = allPlayers[i]; // przypisuje z tablicy allplayers gracza o indeksie i do player aby można było go odczytać 
                        
                    // Kaskadowe wyznaczanie tożsamości gracza ze wsparciem wstecznym dla przestarzał ych kont Riot
                    let displayName = player.riotIdGameName; // Riot wprowadził rozdzielenie nazwy gracza na summonerName (stara nazwa) 
                    if (displayName && player.riotIdTagline) { // i riotIdGameName (nowa nazwa), więc próbujemy wyświetlić nową nazwę, a jeśli jej nie ma, to starą, a jeśli żadna nie jest dostępna, to generujemy nazwę zastępczą na podstawie puuid lub summonerId
                        displayName += " #" + player.riotIdTagline;
                    }
                    
                    if (!displayName || displayName === "") { // przypadek nieaktywnego konta, czytamy stare summonerName przed migracją Riot
                        displayName = player.summonerName;
                    }

                    if (!displayName || displayName === "") {
                        const fallbackId = player.puuid || player.summonerId; // jak w bazie nie ma ani nazwy, (w przypadku riotu po prostu mogło zostać konto usunięte albo zbanowane, lub riot po prostu tego nie udostępnia)
                        if (fallbackId) {                                       // to wtedy generujemy unikalne id dla konta aby można było je odróżnić na liście graczy PUUID --> PUUID stands for Player Universally Unique Identifier. 
                                                                                // It is a long, 78-character string used by Riot Games to identify a specific player account across all of their games (such as League of Legends and Valorant) jest to unikalny sposob riotu
                            displayName = "Konto: " + String(fallbackId).substring(0, 6) + "..."; 
                        } else {
                            displayName = "Zastrzeżony Gracz";
                        }
                    }

                    const itemHtml = `
                        <div class="challenger-item">
                            <span class="challenger-rank">#${i + 1}</span>  
                            <span class="challenger-name">${displayName}</span>
                            <span class="challenger-lp">${player.leaguePoints} LP</span> 
                        </div>
                    `;
                    listContainer.insertAdjacentHTML('beforeend', itemHtml); // szybsze zamiast innerHTML += bo nie niszczy i nie renderuje
                                                                                // istniejacych juz elementow na liscie, jest to optymalniejsze i szybsze, beforeend daje element na koniec listy wewnątrz kontenera 
                }

                displayedCount = endIndex;

                // Ukrycie przycisku "Załaduj więcej" w momencie wyczerpania rekordu
                if (displayedCount >= allPlayers.length) {
                    loadMoreBtn.style.display = 'none';
                } else {
                    loadMoreBtn.style.display = 'block';
                }
            }

            loadMoreBtn.addEventListener('click', renderNextChunk); // po kliknieciu w zaladuj funkcje wywoluje

            // Mechanika zarządzania zakładkami regionów
            const buttons = document.querySelectorAll('.region-btn'); 
            
            buttons.forEach(btn => {
                btn.addEventListener('click', function() { // kazdy przycisk podpina do eventlistenera
                    buttons.forEach(b => b.classList.remove('active'));  
                    this.classList.add('active'); // this do przycisku kliknietego, jest wtedy active (niebieski) a reszta przyciskow nieaktywna (szara)

                    const regionCode = this.getAttribute('data-region'); // getattribute pobiera z atrybutu data-region kod regionu, np. na1, euw1, kr itd
                    fetchChallengers(regionCode);  
                });
            });

            // Wywołanie początkowego zapytania inicjujące stan wejściowy interfejsu
            fetchChallengers('na1');
        });
    </script>
</body>
</html>
